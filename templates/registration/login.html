{% extends 'base.html' %}
{% block title %}Log in - Expense Tracker{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="box">
    <h1 class="mb-3">Log in</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2">Wrong username or password. Try again.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Log in</button>
    </form>
    <p class="mt-3 mb-0 note">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
